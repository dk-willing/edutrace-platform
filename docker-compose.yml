version: "3.9"

# Local development only. Production deployment topology (managed Postgres,
# managed Redis, separate scaling groups per service, af-south-1 region per
# the ML service's own latency notes) is documented in docs/DEPLOYMENT.md
# (added in Phase 17) — this file is not it.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: edutrace
      POSTGRES_PASSWORD: edutrace_dev_only
      POSTGRES_DB: edutrace
    ports:
      - "5432:5432"
    volumes:
      - edutrace_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edutrace"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  ml-service:
    build:
      context: ./services/ml
    restart: unless-stopped
    environment:
      # EDUTRACE_MODEL_DIR is already set in the image (Dockerfile) to the
      # synthetic demo model. Override only to point at a real, approved
      # model artifact once one exists — never leave this implicit in prod.
      ML_SERVICE_SHARED_SECRET: ${ML_SERVICE_SHARED_SECRET:-dev_shared_secret_change_me}
      EDUTRACE_SMS_PROVIDER: ${EDUTRACE_SMS_PROVIDER:-console}
      ARKESEL_API_KEY: ${ARKESEL_API_KEY:-}
      EDUTRACE_API_KEY: ${EDUTRACE_API_KEY:-dev_demo_key_change_me}
    # No published port: only reachable from the api service on the internal
    # compose network. Section 6 — never expose the ML service publicly.
    expose:
      - "8000"
    networks:
      - default

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-service:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://edutrace:edutrace_dev_only@postgres:5432/edutrace
      REDIS_URL: redis://redis:6379
      ML_SERVICE_URL: http://ml-service:8000
      ML_SERVICE_SHARED_SECRET: ${ML_SERVICE_SHARED_SECRET:-dev_shared_secret_change_me}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_access_secret_change_me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_change_me}
      PII_PSEUDONYM_SALT: ${PII_PSEUDONYM_SALT:-dev_salt_change_me}
      NODE_ENV: development
      PORT: "4000"
    ports:
      - "4000:4000"
    networks:
      - default

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NODE_ENV: development
    ports:
      - "3000:3000"
    networks:
      - default

volumes:
  edutrace_pg_data:

networks:
  default:
    driver: bridge
